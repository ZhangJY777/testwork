<!DOCTYPE html>
<html>

<head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <title> - 添加</title>
    <meta name="keywords" content="">
    <meta name="description" content="">

    <link rel="shortcut icon" href="favicon.ico"> <link href="/static/css/bootstrap.min.css?v=3.3.6" rel="stylesheet">
    <link href="/static/css/font-awesome.css?v=4.4.0" rel="stylesheet">



    <link href="/static/css/animate.css" rel="stylesheet">
    <link href="/static/css/style.css?v=4.1.0" rel="stylesheet">

</head>

<body class="gray-bg">
<div class="wrapper wrapper-content animated fadeInRight">
    <div class="row">
        <div class="col-sm-12">
            <div class="ibox float-e-margins">
                <div class="ibox-title">
                    <h5>用户信息确认</h5>
                </div>
                <div class="ibox-content">
                    <form enctype="multipart/form-data" class="form-horizontal m-t" id="signupForm">
                        <div class="form-group">
                            <label class="col-sm-3 control-label">姓名:</label>
                            <div class="col-sm-8">
                                <input id="name" name="name" class="form-control" type="text" value="{{.Name}}">
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label">身份证/统一社会信用代码:</label>
                            <div class="col-sm-8">
                                <input id="id" name="id" class="form-control" type="text" value="{{.IDCard}}">
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label">单位:</label>
                            <div class="col-sm-8">
                                <input id="organization" name="organization" class="form-control" type="text" value="{{.Organization}}">
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label">身份:</label>
                            <div class="col-sm-8">
                                <div class="radio i-checks">
                                    <label>
                                        <input type="radio" value="消费者" name="level"> <a style="font-size: 14px;color: black">消费者</a>
                                    </label>
                                    <label>
                                        <input type="radio" value="商家" name="level"><a style="font-size: 14px;color: black">商家</a>
                                    </label>
                                </div>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label">手机号:</label>
                            <div class="col-sm-8">
                                <input id="tele" name="tele" class="form-control" readonly="readonly" type="text" value="{{.Flag}}">
                            </div>
                        </div>
                        <div class="form-group">
                            <div class="col-sm-8 col-sm-offset-3">
                                <button id="bu" class="btn btn-primary" type="button">通过</button>
                                <button id="no" class="btn btn-primary" type="button">不通过</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>


<!-- 全局js -->
<script src="/static/js/jquery.min.js?v=2.1.4"></script>
<script src="/static/js/bootstrap.min.js?v=3.3.6"></script>

<!-- 自定义js -->
<script src="/static/js/content.js?v=1.0.0"></script>

<!-- jQuery Validation plugin javascript-->
<script src="/static/js/plugins/validate/jquery.validate.min.js"></script>
<script src="/static/js/plugins/validate/messages_zh.min.js"></script>

<script src="/static/js/demo/form-validate-demo.js"></script>
<script src="/static/js/plugins/layer/laydate/laydate.js"></script>
<script>
    $("#bu").click(function () {
        var formdata = new FormData($('#signupForm')[0])
        $.ajax({
            type: "POST",   //Method of submission
            url:"/admin/admin/verify",
            data: formdata,
            async: false,
            cache: false,
            processData: false,
            contentType: false,
            error: function(request) {
                alert("Connection error");
            },
            success: function(data) {  //success
                alert(data);
            }
        });
    });
    $("#no").click(function () {
        var formdata = new FormData($('#signupForm')[0])
        $.ajax({
            type: "POST",   //Method of submission
            url:"/admin/admin/deletu",
            data: formdata,
            async: false,
            cache: false,
            processData: false,
            contentType: false,
            error: function(request) {
                alert("Connection error");
            },
            success: function(data) {  //success
                alert(data);
            }
        });
    });
</script>
</body>

</html>
